# Copilot trigger-metadata corpus.
#
# The Copilot's schema-driven service loader reads a trigger-metadata.json per library and validates every
# claim in it against the resolved package's symbols, so which package version resolves decides what the
# tests assert against. Resolution otherwise falls through to "whatever Central serves latest", which makes
# those assertions hostage to an upstream release: ballerina/smb 2.0.1 removed the WatchEvent record and
# added a compiler plugin rejecting onFileChange, and two tests began failing with "expected [6] but found
# [5]" — a message that names neither the library nor the cause.
#
# Every version below is therefore pinned and pre-fetched (see the pullBallerinaModule calls in
# flow-model-generator-ls-extension/build.gradle), and it is these properties — not a literal in a test —
# that the tests resolve through. A library whose version another LS test already pins reuses that property
# rather than declaring a second one, so the two can never drift apart:
#   ballerina/http       -> stdlibHttpVersion            ballerina/ftp        -> ballerinaFtpVersion
#   ballerina/graphql    -> stdlibGraphqlVersion         ballerinax/kafka     -> ballerinaxKafkaVersion
#   ballerina/grpc       -> stdlibGrpcVersion            ballerinax/rabbitmq  -> ballerinaxRabbitmqVersion
#   ballerinax/mssql     -> ballerinaxMSSQLVersion       ballerinax/cdc       -> ballerinaxCdcVersion
#   ballerinax/trigger.github -> ballerinaxGithubTriggerVersion
# The rest have no sibling to follow and are declared here.
copilotSmbVersion=2.0.1
copilotMcpVersion=1.2.0
copilotWebsubVersion=2.15.0
copilotWebsocketVersion=2.15.0
copilotTriggerGoogleCalendarVersion=0.12.0
copilotAsbVersion=3.10.0

# Ballerina tool versions
migrateTibcoVersion=1.2.13
migrateMuleVersion=1.2.11
